# EduSmart - AI-Powered Personalized Learning Platform
# Production Docker Compose Configuration
# 
# This configuration sets up:
# - FastAPI backend with ML model serving
# - Next.js frontend with optimized build
# - Caddy reverse proxy with automatic SSL
# - Health checks and monitoring
# - Multi-architecture support

services:
  api:
    image: gozdedzog/edusmart-api:latest
    container_name: edusmart-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - ML_MODEL_PATH=./data/best_learning_model_full.joblib
      - LOG_LEVEL=WARNING
      - API_V1_STR=/api/v1
      - PROJECT_NAME=EduSmart API
      - VERSION=1.0.0
      - ALLOWED_ORIGINS=["https://edusmart.tr","https://www.edusmart.tr","https://api.edusmart.tr","http://localhost:3000","http://localhost:3001"]
      - ALLOWED_HOSTS=["*"]
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - edusmart-network

  web:
    image: gozdedzog/edusmart-web:latest
    container_name: edusmart-web
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - edusmart-network

  # Caddy Reverse Proxy with SSL
  caddy:
    image: caddy:2-alpine
    container_name: edusmart-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - edusmart-network

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  edusmart-network:
    driver: bridge
    name: edusmart-network