# EduSmart Platform - Docker Compose Configuration
version: '3.8'

services:
  # Frontend Service
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ML_API_URL=http://api:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - api
    networks:
      - edusmart-network
    restart: unless-stopped

  # Backend API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - ML_MODEL_PATH=./data/best_learning_model_full.joblib
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    networks:
      - edusmart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - edusmart-network
    restart: unless-stopped

networks:
  edusmart-network:
    driver: bridge

volumes:
  logs:
    driver: local
