# EduSmart Platform - Development Docker Compose

services:
  # Frontend Service (Development)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: deps
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    # env_file:
    #   - .env
    #   - .env.local
    volumes:
      # Bind mount source code for live reload
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
      # Persistent data directories
      - ./apps/web/data:/app/data
      - ./data:/data
    command: pnpm dev
    networks:
      - edusmart-dev-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API Service (Development)
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - ML_MODEL_PATH=./data/best_learning_model_full.joblib
      - LOG_LEVEL=DEBUG
    # env_file:
    #   - .env
    volumes:
      # Bind mount source code for live reload
      - ./apps/api:/app
      # Persistent data directories
      - ./data:/app/data:ro
      - ./apps/api/logs:/app/logs
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - edusmart-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  edusmart-dev-network:
    driver: bridge