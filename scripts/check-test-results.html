<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sonuçları Kontrol</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test Sonuçları Kontrol</h1>
    <div id="results"></div>

    <script>
        function checkTestResults() {
            const resultsDiv = document.getElementById('results');
            let html = '';

            // 1. Test Results kontrolü
            try {
                const testResults = localStorage.getItem('testResults');
                if (testResults) {
                    const results = JSON.parse(testResults);
                    html += `<div class="result success">
                        <h3>✅ Test Sonuçları (localStorage)</h3>
                        <p><strong>Toplam test sayısı:</strong> ${results.length}</p>
                        <pre>${JSON.stringify(results, null, 2)}</pre>
                    </div>`;
                } else {
                    html += `<div class="result error">
                        <h3>❌ Test Sonuçları Bulunamadı</h3>
                        <p>localStorage'da 'testResults' anahtarı bulunamadı.</p>
                    </div>`;
                }
            } catch (error) {
                html += `<div class="result error">
                    <h3>❌ Test Sonuçları Okuma Hatası</h3>
                    <p>${error.message}</p>
                </div>`;
            }

            // 2. Content Completions kontrolü
            try {
                const contentCompletions = localStorage.getItem('smart-learn-content-completions');
                if (contentCompletions) {
                    const completions = JSON.parse(contentCompletions);
                    html += `<div class="result success">
                        <h3>✅ İçerik Tamamlama Verileri</h3>
                        <p><strong>Toplam tamamlama sayısı:</strong> ${completions.length}</p>
                        <pre>${JSON.stringify(completions, null, 2)}</pre>
                    </div>`;
                } else {
                    html += `<div class="result error">
                        <h3>❌ İçerik Tamamlama Verileri Bulunamadı</h3>
                        <p>localStorage'da 'smart-learn-content-completions' anahtarı bulunamadı.</p>
                    </div>`;
                }
            } catch (error) {
                html += `<div class="result error">
                    <h3>❌ İçerik Tamamlama Verileri Okuma Hatası</h3>
                    <p>${error.message}</p>
                </div>`;
            }

            // 3. Learning Scores kontrolü
            try {
                const learningScores = localStorage.getItem('learning');
                if (learningScores) {
                    const scores = JSON.parse(learningScores);
                    html += `<div class="result success">
                        <h3>✅ Öğrenme Skorları</h3>
                        <p><strong>Toplam skor sayısı:</strong> ${Object.keys(scores).length}</p>
                        <pre>${JSON.stringify(scores, null, 2)}</pre>
                    </div>`;
                } else {
                    html += `<div class="result error">
                        <h3>❌ Öğrenme Skorları Bulunamadı</h3>
                        <p>localStorage'da 'learning' anahtarı bulunamadı.</p>
                    </div>`;
                }
            } catch (error) {
                html += `<div class="result error">
                    <h3>❌ Öğrenme Skorları Okuma Hatası</h3>
                    <p>${error.message}</p>
                </div>`;
            }

            // 4. Tüm localStorage anahtarlarını listele
            html += `<div class="result">
                <h3>📋 Tüm localStorage Anahtarları</h3>
                <ul>`;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                html += `<li><strong>${key}</strong></li>`;
            }
            html += `</ul></div>`;

            resultsDiv.innerHTML = html;
        }

        // Sayfa yüklendiğinde kontrol et
        checkTestResults();
    </script>
</body>
</html>
