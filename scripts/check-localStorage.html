<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage Eğitim Kontrolü</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .course { border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .course h3 { color: #333; margin-top: 0; }
        .course-info { margin: 5px 0; }
        .type-video { background-color: #e3f2fd; }
        .type-article { background-color: #f3e5f5; }
        .published { color: green; font-weight: bold; }
        .draft { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📚 LocalStorage Eğitim Kontrolü</h1>
    <button onclick="loadCourses()">Eğitimleri Yükle</button>
    <button onclick="clearStorage()">Storage'ı Temizle</button>
    <div id="courses"></div>

    <script>
        function loadCourses() {
            const courses = JSON.parse(localStorage.getItem('smart_learn_courses') || '[]');
            const container = document.getElementById('courses');
            
            if (courses.length === 0) {
                container.innerHTML = '<p>❌ LocalStorage\'da eğitim bulunamadı.</p>';
                return;
            }

            container.innerHTML = `<h2>📊 Toplam ${courses.length} eğitim bulundu:</h2>`;
            
            courses.forEach((course, index) => {
                const courseDiv = document.createElement('div');
                courseDiv.className = `course ${course.type === 'VIDEO' ? 'type-video' : 'type-article'}`;
                
                courseDiv.innerHTML = `
                    <h3>${index + 1}. ${course.title}</h3>
                    <div class="course-info"><strong>Açıklama:</strong> ${course.description}</div>
                    <div class="course-info"><strong>Tür:</strong> ${course.type === 'VIDEO' ? '🎥 Video' : '📝 Yazılı İçerik'}</div>
                    <div class="course-info"><strong>Kategori:</strong> ${course.category}</div>
                    <div class="course-info"><strong>Süre:</strong> ${course.duration} dakika</div>
                    <div class="course-info"><strong>Durum:</strong> <span class="${course.isPublished ? 'published' : 'draft'}">${course.isPublished ? 'Yayında' : 'Taslak'}</span></div>
                    <div class="course-info"><strong>Oluşturulma:</strong> ${new Date(course.createdAt).toLocaleDateString('tr-TR')}</div>
                    <div class="course-info"><strong>İçerik:</strong> ${course.content.length > 100 ? course.content.substring(0, 100) + '...' : course.content}</div>
                    <div class="course-info"><strong>ID:</strong> ${course.id}</div>
                `;
                
                container.appendChild(courseDiv);
            });
        }

        function clearStorage() {
            if (confirm('LocalStorage\'ı temizlemek istediğinizden emin misiniz?')) {
                localStorage.removeItem('smart_learn_courses');
                document.getElementById('courses').innerHTML = '<p>✅ LocalStorage temizlendi.</p>';
            }
        }

        // Sayfa yüklendiğinde otomatik yükle
        window.onload = loadCourses;
    </script>
</body>
</html>
